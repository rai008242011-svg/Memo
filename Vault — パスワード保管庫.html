<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vault — パスワード保管庫</title>
<style>
  :root {
    --bg: #f3f1ea; --surface: #ffffff; --surface2: #ebe8dd;
    --text: #1d1b16; --text-dim: #6b665a; --accent: #9c7a1f; --accent-ink: #fffdf6;
    --danger: #a8453a; --warn: #9c7a1f; --border: #d9d4c4;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15140f; --surface: #1d1b14; --surface2: #262318;
      --text: #f2efe4; --text-dim: #a39c87; --accent: #d4ac3f; --accent-ink: #1a1506;
      --danger: #e07263; --warn: #d4ac3f; --border: #393523;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans);
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { display: flex; align-items: flex-start; justify-content: center; padding: 48px 20px; }
  .wrap { width: 100%; max-width: 560px; }
  .brand { font-family: var(--serif); font-size: 15px; letter-spacing: 0.04em; color: var(--text-dim); margin-bottom: 8px; }
  h1 { font-family: var(--serif); font-weight: 400; font-size: 34px; line-height: 1.15; margin: 0 0 28px; max-width: 20ch; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 3px; padding: 28px; }
  label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }
  input, select, textarea {
    width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 2px;
    padding: 11px 12px; font-size: 15px; color: var(--text); font-family: var(--mono);
  }
  select { font-family: var(--sans); }
  textarea { font-family: var(--sans); min-height: 70px; resize: vertical; }
  input:focus-visible, button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .field { margin-bottom: 16px; }
  button { cursor: pointer; border: none; border-radius: 2px; font-size: 14px; font-family: var(--sans); padding: 11px 18px; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); width: 100%; }
  .btn-ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--border); }
  .btn-small { padding: 7px 11px; font-size: 13px; }
  .btn-tab { background: var(--surface2); color: var(--text-dim); border: 1px solid var(--border); flex: 1; }
  .btn-tab.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .error { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 1em; }
  .hint { color: var(--text-dim); font-size: 13px; margin-top: 18px; line-height: 1.6; }
  .top-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 20px; gap: 10px; flex-wrap: wrap; }
  .top-row h1 { margin: 0; font-size: 24px; }
  .top-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .type-tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .filter-row { display: flex; gap: 8px; margin: 18px 0 14px; }
  .filter-row input { flex: 2; } .filter-row select { flex: 1; }
  .entries { display: flex; flex-direction: column; gap: 10px; }
  .entry { border: 1px solid var(--border); border-radius: 3px; padding: 14px 16px; background: var(--surface2); }
  .entry-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .entry-site { font-weight: 600; font-size: 15px; }
  .entry-meta { color: var(--text-dim); font-size: 12px; margin-top: 2px; font-family: var(--mono); }
  .entry-folder { display: inline-block; font-size: 11px; color: var(--accent); border: 1px solid var(--accent); border-radius: 10px; padding: 1px 8px; margin-top: 6px; }
  .entry-actions { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; }
  .pw-row, .totp-row, .note-row { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-family: var(--mono); font-size: 14px; }
  .pw-value, .note-value { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 2px; padding: 7px 10px; letter-spacing: .5px; overflow-x: auto; white-space: pre-wrap; }
  .totp-code { font-size: 20px; letter-spacing: 2px; background: var(--surface); border: 1px solid var(--border); border-radius: 2px; padding: 6px 12px; }
  .totp-bar-wrap { flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .totp-bar { height: 100%; background: var(--accent); transition: width 1s linear; }
  .empty { color: var(--text-dim); font-size: 14px; padding: 24px 0; text-align: center; }
  .gen-row { display: flex; gap: 8px; }
  .gen-row input { flex: 1; }
  .divider { border: none; border-top: 1px solid var(--border); margin: 22px 0; }
  .toast { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 3px; font-size: 13px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .panel { margin-top: 18px; }
  .health-group { margin-bottom: 14px; }
  .health-group h3 { font-size: 13px; color: var(--text-dim); margin: 0 0 8px; font-weight: 600; }
  .health-item { font-size: 14px; padding: 8px 10px; background: var(--surface2); border-radius: 2px; margin-bottom: 6px; border-left: 3px solid var(--danger); }
  .health-item.warn { border-left-color: var(--warn); }
  .health-ok { color: var(--text-dim); font-size: 14px; }
  .hidden-file { display: none; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">VAULT</div>

  <div id="screen-setup" hidden>
    <h1>4桁のPINを<br>決めてください</h1>
    <div class="card">
      <div class="field"><label for="setup-pw">PIN(数字4桁)</label><input id="setup-pw" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="new-password" style="letter-spacing:6px;font-size:22px;text-align:center;"></div>
      <div class="field"><label for="setup-pw2">もう一度入力</label><input id="setup-pw2" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="new-password" style="letter-spacing:6px;font-size:22px;text-align:center;"></div>
      <button class="btn-primary" id="setup-btn">保管庫を作成</button>
      <div class="error" id="setup-error"></div>
    </div>
    <div class="hint">4桁PINは覚えやすい分、総当たりには弱くなります。この端末を自分以外が触る可能性があるなら注意してください。忘れると中のデータは復元できません。<br>すでにバックアップファイルをお持ちの場合は <button class="btn-ghost btn-small" id="goto-import" style="padding:3px 8px;">インポート</button> から復元できます。</div>
    <input type="file" id="import-file" class="hidden-file" accept="application/json">
  </div>

  <div id="screen-unlock" hidden>
    <h1>保管庫をひらく</h1>
    <div class="card">
      <div class="field"><label for="unlock-pw">PIN</label><input id="unlock-pw" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="current-password" style="letter-spacing:6px;font-size:22px;text-align:center;"></div>
      <button class="btn-primary" id="unlock-btn">アンロック</button>
      <div class="error" id="unlock-error"></div>
    </div>
    <div class="hint">PINを忘れた場合、中のデータは復元できませんが、<button class="btn-ghost btn-small" id="reset-btn" style="padding:3px 8px;">リセットして最初から作り直す</button> ことはできます。</div>
  </div>

  <div id="screen-vault" hidden>
    <div class="top-row">
      <h1>保管庫</h1>
      <div class="top-actions">
        <button class="btn-ghost btn-small" id="health-btn">健全性チェック</button>
        <button class="btn-ghost btn-small" id="export-btn">エクスポート</button>
        <button class="btn-ghost btn-small" id="lock-btn">ロック</button>
      </div>
    </div>

    <div id="health-panel" class="panel" hidden></div>

    <div class="card">
      <div class="type-tabs">
        <button class="btn-tab active" id="tab-login" type="button">ログイン情報</button>
        <button class="btn-tab" id="tab-note" type="button">セキュアメモ</button>
      </div>

      <div id="form-login">
        <div class="field"><label for="f-site">サイト名</label><input id="f-site" type="text" placeholder="例: Gmail" style="font-family:var(--sans);"></div>
        <div class="field"><label for="f-user">ID / メールアドレス</label><input id="f-user" type="text" autocomplete="off"></div>
        <div class="field">
          <label for="f-pass">パスワード</label>
          <div class="gen-row"><input id="f-pass" type="text" autocomplete="off"><button class="btn-ghost btn-small" id="gen-btn" type="button">生成</button></div>
        </div>
        <div class="field"><label for="f-totp">TOTPシークレット(任意・2段階認証用)</label><input id="f-totp" type="text" placeholder="例: JBSWY3DPEHPK3PXP"></div>
      </div>
      <div id="form-note" hidden>
        <div class="field"><label for="n-title">タイトル</label><input id="n-title" type="text" placeholder="例: Wi-Fiパスワード" style="font-family:var(--sans);"></div>
        <div class="field"><label for="n-content">内容</label><textarea id="n-content"></textarea></div>
      </div>
      <div class="field"><label for="f-folder">フォルダ / タグ(任意)</label><input id="f-folder" type="text" placeholder="例: 仕事" style="font-family:var(--sans);"></div>

      <button class="btn-primary" id="add-btn">追加して保存</button>
      <div class="error" id="add-error"></div>
    </div>

    <div class="filter-row">
      <input id="search-box" type="text" placeholder="検索(サイト名・ID・フォルダ)" style="font-family:var(--sans);">
      <select id="folder-filter"><option value="">すべてのフォルダ</option></select>
    </div>

    <div id="entries" class="entries"></div>

    <input type="file" id="import-file-vault" class="hidden-file" accept="application/json">
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var STORE_KEY = "vault_store_v1";
  var enc = new TextEncoder();
  var dec = new TextDecoder();
  var sessionKey = null;
  var currentEntries = [];
  var currentType = "login";
  var totpTimer = null;
  var downloadsCap = null;

  function b64(buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); }
  function unb64(str) { var bin = atob(str); var arr = new Uint8Array(bin.length); for (var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i); return arr.buffer; }
  function randomBytes(n) { return crypto.getRandomValues(new Uint8Array(n)); }
  function uid() { return b64(randomBytes(9)).replace(/[^a-zA-Z0-9]/g,"").slice(0,12); }

  function askConfirm(message) {
    return new Promise(function(resolve){
      var overlay = document.createElement("div");
      overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px;";
      var box = document.createElement("div");
      box.style.cssText = "background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:22px;max-width:340px;width:100%;";
      box.innerHTML = '<div style="margin-bottom:18px;font-size:14px;line-height:1.5;"></div><div style="display:flex;gap:8px;"><button class="btn-ghost btn-small" style="flex:1;" data-c="cancel">キャンセル</button><button class="btn-danger btn-small" style="flex:1;" data-c="ok">実行</button></div>';
      box.querySelector("div").textContent = message;
      overlay.appendChild(box);
      document.body.appendChild(overlay);
      box.querySelector('[data-c="cancel"]').addEventListener("click", function(){ document.body.removeChild(overlay); resolve(false); });
      box.querySelector('[data-c="ok"]').addEventListener("click", function(){ document.body.removeChild(overlay); resolve(true); });
      overlay.addEventListener("click", function(e){ if (e.target === overlay) { document.body.removeChild(overlay); resolve(false); } });
    });
  }
  function notify(message) {
    showToast(message);
  }

  function loadStore() { try { var raw = localStorage.getItem(STORE_KEY); return raw ? JSON.parse(raw) : null; } catch(e){ return null; } }
  function saveStore(store) { localStorage.setItem(STORE_KEY, JSON.stringify(store)); }

  async function deriveKey(password, saltB64) {
    var salt = unb64(saltB64);
    var baseKey = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name:"PBKDF2", salt:salt, iterations:250000, hash:"SHA-256" }, baseKey, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]);
  }
  async function encryptJSON(key, obj) {
    var iv = randomBytes(12);
    var cipher = await crypto.subtle.encrypt({ name:"AES-GCM", iv:iv }, key, enc.encode(JSON.stringify(obj)));
    return { iv:b64(iv), data:b64(cipher) };
  }
  async function decryptJSON(key, payload) {
    var plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv:unb64(payload.iv) }, key, unb64(payload.data));
    return JSON.parse(dec.decode(plain));
  }

  function genPassword(len) {
    len = len || 20;
    var chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*-_=+";
    var out = ""; var vals = randomBytes(len);
    for (var i=0;i<len;i++) out += chars[vals[i] % chars.length];
    return out;
  }

  // ---- TOTP (RFC 6238) ----
  function base32decode(b32) {
    var alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
    b32 = b32.replace(/=+$/,"").toUpperCase().replace(/\s/g,"");
    var bits = "";
    for (var i=0;i<b32.length;i++) { var v = alphabet.indexOf(b32[i]); if (v===-1) continue; bits += v.toString(2).padStart(5,"0"); }
    var bytes = [];
    for (var j=0;j+8<=bits.length;j+=8) bytes.push(parseInt(bits.substr(j,8),2));
    return new Uint8Array(bytes);
  }
  async function totpCode(secretB32) {
    var key = base32decode(secretB32);
    if (!key.length) return "------";
    var counter = Math.floor(Date.now()/1000/30);
    var buf = new ArrayBuffer(8); var view = new DataView(buf); view.setUint32(4, counter);
    var cryptoKey = await crypto.subtle.importKey("raw", key, { name:"HMAC", hash:"SHA-1" }, false, ["sign"]);
    var sig = new Uint8Array(await crypto.subtle.sign("HMAC", cryptoKey, buf));
    var offset = sig[sig.length-1] & 0xf;
    var code = ((sig[offset]&0x7f)<<24 | (sig[offset+1]&0xff)<<16 | (sig[offset+2]&0xff)<<8 | (sig[offset+3]&0xff)) % 1000000;
    return code.toString().padStart(6,"0");
  }

  function showToast(msg) {
    var t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
    setTimeout(function(){ t.classList.remove("show"); }, 1600);
  }
  function showScreen(id) {
    ["screen-setup","screen-unlock","screen-vault"].forEach(function(s){ document.getElementById(s).hidden = (s!==id); });
  }

  async function persist(entries) {
    var store = loadStore();
    store.vault = await encryptJSON(sessionKey, entries);
    saveStore(store);
    currentEntries = entries;
  }

  function populateFolders(entries) {
    var sel = document.getElementById("folder-filter");
    var current = sel.value;
    var folders = Array.from(new Set(entries.map(function(e){ return e.folder; }).filter(Boolean))).sort();
    sel.innerHTML = '<option value="">すべてのフォルダ</option>' + folders.map(function(f){ return '<option value="'+f.replace(/"/g,"&quot;")+'">'+f+'</option>'; }).join("");
    if (folders.indexOf(current) !== -1) sel.value = current;
  }

  function filterEntries(entries) {
    var q = document.getElementById("search-box").value.trim().toLowerCase();
    var folder = document.getElementById("folder-filter").value;
    return entries.filter(function(e){
      if (folder && e.folder !== folder) return false;
      if (!q) return true;
      var hay = [e.site, e.user, e.folder, e.note].filter(Boolean).join(" ").toLowerCase();
      return hay.indexOf(q) !== -1;
    });
  }

  function renderEntries() {
    populateFolders(currentEntries);
    var list = filterEntries(currentEntries);
    var container = document.getElementById("entries");
    container.innerHTML = "";
    if (!list.length) { container.innerHTML = '<div class="empty">該当する項目がありません</div>'; return; }

    list.forEach(function (entry) {
      var realIdx = currentEntries.indexOf(entry);
      var el = document.createElement("div");
      el.className = "entry";
      var typeLabel = entry.type === "note" ? "メモ" : "ログイン";
      el.innerHTML =
        '<div class="entry-top">' +
          '<div><div class="entry-site"></div><div class="entry-meta"></div>' +
          (entry.folder ? '<div class="entry-folder"></div>' : '') + '</div>' +
          '<div class="entry-actions">' +
            (entry.type === "login" ? '<button class="btn-ghost btn-small" data-action="toggle">表示</button><button class="btn-ghost btn-small" data-action="copy">コピー</button>' : '<button class="btn-ghost btn-small" data-action="toggle">表示</button>') +
            '<button class="btn-danger btn-small" data-action="delete">削除</button>' +
          '</div>' +
        '</div>';
      el.querySelector(".entry-site").textContent = entry.type === "note" ? entry.site : entry.site;
      el.querySelector(".entry-meta").textContent = entry.type === "note" ? "メモ" : (entry.user || "");
      if (entry.folder) el.querySelector(".entry-folder").textContent = entry.folder;

      if (entry.type === "login") {
        var pwRow = document.createElement("div");
        pwRow.className = "pw-row"; pwRow.hidden = true;
        pwRow.innerHTML = '<div class="pw-value"></div>';
        pwRow.querySelector(".pw-value").textContent = entry.pass;
        el.appendChild(pwRow);

        if (entry.totp) {
          var totpRow = document.createElement("div");
          totpRow.className = "totp-row";
          totpRow.innerHTML = '<div class="totp-code">------</div><div class="totp-bar-wrap"><div class="totp-bar" style="width:100%"></div></div><button class="btn-ghost btn-small" data-action="copy-totp">コピー</button>';
          totpRow.setAttribute("data-totp-secret", entry.totp);
          el.appendChild(totpRow);
          totpRow.querySelector('[data-action="copy-totp"]').addEventListener("click", function(){
            var code = totpRow.querySelector(".totp-code").textContent;
            navigator.clipboard.writeText(code).then(function(){ showToast("コードをコピーしました"); });
          });
        }
        el.querySelector('[data-action="toggle"]').addEventListener("click", function(e){
          pwRow.hidden = !pwRow.hidden; e.target.textContent = pwRow.hidden ? "表示" : "隠す";
        });
        el.querySelector('[data-action="copy"]').addEventListener("click", function(){
          navigator.clipboard.writeText(entry.pass).then(function(){ showToast("パスワードをコピーしました"); }).catch(function(){ showToast("コピーに失敗しました"); });
        });
      } else {
        var noteRow = document.createElement("div");
        noteRow.className = "note-row"; noteRow.hidden = true;
        noteRow.innerHTML = '<div class="note-value"></div>';
        noteRow.querySelector(".note-value").textContent = entry.note;
        el.appendChild(noteRow);
        el.querySelector('[data-action="toggle"]').addEventListener("click", function(e){
          noteRow.hidden = !noteRow.hidden; e.target.textContent = noteRow.hidden ? "表示" : "隠す";
        });
      }

      el.querySelector('[data-action="delete"]').addEventListener("click", async function(){
        var ok = await askConfirm((entry.site||"この項目") + " を削除しますか？");
        if (!ok) return;
        var next = currentEntries.slice(); next.splice(realIdx,1);
        await persist(next); renderEntries();
      });
      container.appendChild(el);
    });
  }

  async function refreshTotpCodes() {
    var rows = document.querySelectorAll(".totp-row[data-totp-secret]");
    if (!rows.length) return;
    var remain = 30 - (Math.floor(Date.now()/1000) % 30);
    for (var i=0;i<rows.length;i++) {
      var secret = rows[i].getAttribute("data-totp-secret");
      var code = await totpCode(secret);
      rows[i].querySelector(".totp-code").textContent = code.slice(0,3) + " " + code.slice(3);
      rows[i].querySelector(".totp-bar").style.width = (remain/30*100) + "%";
    }
  }

  function renderHealth() {
    var panel = document.getElementById("health-panel");
    var logins = currentEntries.filter(function(e){ return e.type === "login"; });
    var byPass = {};
    logins.forEach(function(e){ byPass[e.pass] = (byPass[e.pass]||[]); byPass[e.pass].push(e); });
    var reused = Object.keys(byPass).filter(function(p){ return byPass[p].length > 1; });
    var weak = logins.filter(function(e){
      var p = e.pass;
      var classes = [/[a-z]/.test(p), /[A-Z]/.test(p), /[0-9]/.test(p), /[^a-zA-Z0-9]/.test(p)].filter(Boolean).length;
      return p.length < 10 || classes < 3;
    });
    var now = Date.now(); var old = logins.filter(function(e){ return e.createdAt && (now - e.createdAt) > 1000*60*60*24*180; });

    var html = "";
    if (!logins.length) { panel.innerHTML = '<div class="card"><div class="health-ok">ログイン項目がまだありません</div></div>'; return; }
    html += '<div class="card">';
    html += '<div class="health-group"><h3>使い回されているパスワード (' + reused.length + ')</h3>';
    html += reused.length ? reused.map(function(p){ return '<div class="health-item">' + byPass[p].map(function(e){return e.site;}).join(" / ") + '</div>'; }).join("") : '<div class="health-ok">問題なし</div>';
    html += '</div>';
    html += '<div class="health-group"><h3>弱いパスワード (' + weak.length + ')</h3>';
    html += weak.length ? weak.map(function(e){ return '<div class="health-item warn">' + e.site + ' — 長さや文字種が不足しています</div>'; }).join("") : '<div class="health-ok">問題なし</div>';
    html += '</div>';
    html += '<div class="health-group"><h3>180日以上更新されていない (' + old.length + ')</h3>';
    html += old.length ? old.map(function(e){ return '<div class="health-item warn">' + e.site + '</div>'; }).join("") : '<div class="health-ok">問題なし</div>';
    html += '</div></div>';
    panel.innerHTML = html;
  }

  async function doExport() {
    var store = loadStore();
    if (!store) return;
    var blob = JSON.stringify(store, null, 2);
    if (!downloadsCap) {
      try { downloadsCap = await claude.use("downloads"); } catch(e) { downloadsCap = null; }
    }
    if (downloadsCap) {
      try {
        await downloadsCap.save({ filename: "vault-backup.json", data: blob });
        showToast("エクスポートしました");
      } catch(e) { showToast("エクスポートがキャンセルされました"); }
    } else {
      showToast("この環境ではエクスポートを使えません");
    }
  }

  function doImport(file, afterImport) {
    var reader = new FileReader();
    reader.onload = async function() {
      try {
        var data = JSON.parse(reader.result);
        if (!data.salt || !data.verifier || !data.vault) throw new Error("invalid");
        if (loadStore()) {
          var ok = await askConfirm("既存の保管庫を上書きします。よろしいですか？");
          if (!ok) return;
        }
        saveStore(data);
        notify("インポートしました");
        afterImport();
      } catch(e) { notify("ファイルの形式が正しくありません"); }
    };
    reader.readAsText(file);
  }

  async function init() {
    if (window.claude && window.claude.use) { try { downloadsCap = await claude.use("downloads"); } catch(e) {} }

    var store = loadStore();
    showScreen(store ? "screen-unlock" : "screen-setup");

    document.getElementById("goto-import").addEventListener("click", function(){ document.getElementById("import-file").click(); });
    document.getElementById("import-file").addEventListener("change", function(e){
      if (e.target.files[0]) doImport(e.target.files[0], function(){ showScreen("screen-unlock"); });
    });

    document.getElementById("setup-btn").addEventListener("click", async function () {
      var pw1 = document.getElementById("setup-pw").value, pw2 = document.getElementById("setup-pw2").value;
      var err = document.getElementById("setup-error"); err.textContent = "";
      if (!/^[0-9]{4}$/.test(pw1)) { err.textContent = "数字4桁で入力してください"; return; }
      if (pw1 !== pw2) { err.textContent = "PINが一致しません"; return; }
      var salt = b64(randomBytes(16));
      var key = await deriveKey(pw1, salt);
      var verifier = await encryptJSON(key, { ok: true });
      var vault = await encryptJSON(key, []);
      saveStore({ salt: salt, verifier: verifier, vault: vault });
      sessionKey = key; currentEntries = [];
      renderEntries();
      showScreen("screen-vault");
      totpTimer = setInterval(refreshTotpCodes, 1000);
    });

    document.getElementById("unlock-btn").addEventListener("click", async function () {
      var pw = document.getElementById("unlock-pw").value;
      var err = document.getElementById("unlock-error"); err.textContent = "";
      var s = loadStore();
      try {
        var key = await deriveKey(pw, s.salt);
        await decryptJSON(key, s.verifier);
        sessionKey = key;
        currentEntries = await decryptJSON(key, s.vault);
        document.getElementById("unlock-pw").value = "";
        renderEntries();
        showScreen("screen-vault");
        if (totpTimer) clearInterval(totpTimer);
        totpTimer = setInterval(refreshTotpCodes, 1000);
      } catch (e) { err.textContent = "PINが違います"; }
    });
    document.getElementById("unlock-pw").addEventListener("keydown", function(e){ if (e.key==="Enter") document.getElementById("unlock-btn").click(); });

    var resetBtn = document.getElementById("reset-btn");
    if (resetBtn) resetBtn.addEventListener("click", async function(){
      var ok = await askConfirm("本当にリセットしますか？保存済みのデータはすべて消え、復元できません。");
      if (ok) {
        localStorage.removeItem(STORE_KEY);
        showScreen("screen-setup");
      }
    });

    document.getElementById("tab-login").addEventListener("click", function(){
      currentType = "login";
      document.getElementById("tab-login").classList.add("active");
      document.getElementById("tab-note").classList.remove("active");
      document.getElementById("form-login").hidden = false;
      document.getElementById("form-note").hidden = true;
    });
    document.getElementById("tab-note").addEventListener("click", function(){
      currentType = "note";
      document.getElementById("tab-note").classList.add("active");
      document.getElementById("tab-login").classList.remove("active");
      document.getElementById("form-note").hidden = false;
      document.getElementById("form-login").hidden = true;
    });

    document.getElementById("gen-btn").addEventListener("click", function(){ document.getElementById("f-pass").value = genPassword(20); });

    document.getElementById("add-btn").addEventListener("click", async function () {
      var err = document.getElementById("add-error"); err.textContent = "";
      var folder = document.getElementById("f-folder").value.trim();
      var entry;
      if (currentType === "login") {
        var site = document.getElementById("f-site").value.trim();
        var user = document.getElementById("f-user").value.trim();
        var pass = document.getElementById("f-pass").value;
        var totp = document.getElementById("f-totp").value.trim().replace(/\s/g,"");
        if (!site || !pass) { err.textContent = "サイト名とパスワードは必須です"; return; }
        entry = { id: uid(), type: "login", site: site, user: user, pass: pass, totp: totp || null, folder: folder || null, createdAt: Date.now() };
        document.getElementById("f-site").value = ""; document.getElementById("f-user").value = "";
        document.getElementById("f-pass").value = ""; document.getElementById("f-totp").value = "";
      } else {
        var title = document.getElementById("n-title").value.trim();
        var content = document.getElementById("n-content").value;
        if (!title || !content) { err.textContent = "タイトルと内容は必須です"; return; }
        entry = { id: uid(), type: "note", site: title, note: content, folder: folder || null, createdAt: Date.now() };
        document.getElementById("n-title").value = ""; document.getElementById("n-content").value = "";
      }
      document.getElementById("f-folder").value = "";
      var next = currentEntries.concat([entry]);
      await persist(next);
      renderEntries();
      showToast("保存しました");
    });

    document.getElementById("search-box").addEventListener("input", renderEntries);
    document.getElementById("folder-filter").addEventListener("change", renderEntries);

    document.getElementById("health-btn").addEventListener("click", function(){
      var panel = document.getElementById("health-panel");
      if (panel.hidden) { renderHealth(); panel.hidden = false; } else { panel.hidden = true; }
    });

    document.getElementById("export-btn").addEventListener("click", doExport);

    document.getElementById("lock-btn").addEventListener("click", function () {
      sessionKey = null; currentEntries = [];
      if (totpTimer) { clearInterval(totpTimer); totpTimer = null; }
      document.getElementById("health-panel").hidden = true;
      showScreen("screen-unlock");
    });
  }

  init();
})();
</script>
</body>
</html>
